name: Build local release candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full reviewed commit SHA to package
        required: true
        type: string
      confirmation:
        description: Type BUILD_LOCAL_RC; this workflow never publishes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: local-release-candidate
  cancel-in-progress: false

jobs:
  build:
    name: Verified npm tarball
    if: inputs.confirmation == 'BUILD_LOCAL_RC'
    environment: local-release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the explicitly approved commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
      - name: Use the minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.1
      - name: Verify the approved source identity
        env:
          RELEASE_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: node ./scripts/repository-checks.mjs revision
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository, secret, dependency, and test checks
        run: |
          npm run lint
          npm run check:secrets
          npm audit --audit-level=low
          npm test
      - name: Build and independently inspect the npm tarball
        run: |
          mkdir release-candidate
          npm pack --pack-destination release-candidate --json > release-candidate/pack-report.json
          node ./scripts/repository-checks.mjs pack < release-candidate/pack-report.json
          node ./scripts/repository-checks.mjs artifact release-candidate/pack-report.json
      - name: Upload immutable release-candidate inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bookarium-codex-connector-0.1.0-${{ inputs.commit_sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 14
